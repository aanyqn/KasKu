name: kasku
description: "Kasku - Aplikasi Pencatatan Cashflow Pribadi"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Charts
  fl_chart: ^0.68.0

  # Formatting
  intl: ^0.19.0

  # Sharing & File Picking (Backup/Restore)
  share_plus: ^9.0.0
  file_picker: ^8.0.7

  # UI & Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation for Isar
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
